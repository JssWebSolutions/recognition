<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="iconBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1a2e;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#16213e;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="iconFace" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#00d4ff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#7b2cbf;stop-opacity:1" />
    </linearGradient>
    <filter id="iconGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="1.5" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <style>
    @keyframes iconScan {
      0% { transform: translateY(8px); opacity: 0; }
      15% { opacity: 1; }
      85% { opacity: 1; }
      100% { transform: translateY(50px); opacity: 0; }
    }
    @keyframes iconPulse {
      0%, 100% { opacity: 0.6; }
      50% { opacity: 1; }
    }
    @keyframes eyeBlink {
      0%, 45%, 55%, 100% { transform: scaleY(1); }
      50% { transform: scaleY(0.15); }
    }
    @keyframes iconDot {
      0%, 100% { opacity: 0.4; }
      50% { opacity: 1; }
    }
    .icon-scan { animation: iconScan 2.5s ease-in-out infinite; }
    .icon-face { animation: iconPulse 2s ease-in-out infinite; }
    .icon-eye-l { animation: eyeBlink 3s ease-in-out infinite; transform-origin: 24px 26px; }
    .icon-eye-r { animation: eyeBlink 3s ease-in-out infinite; transform-origin: 40px 26px; }
    .icon-dot-1 { animation: iconDot 1.5s ease-in-out infinite; }
    .icon-dot-2 { animation: iconDot 1.5s ease-in-out infinite 0.2s; }
    .icon-dot-3 { animation: iconDot 1.5s ease-in-out infinite 0.4s; }
  </style>
  
  <!-- Background -->
  <rect width="64" height="64" rx="12" fill="url(#iconBg)"/>
  
  <!-- Corner accents -->
  <path d="M8,8 L8,14 M8,8 L14,8" fill="none" stroke="#00d4ff" stroke-width="1.5" stroke-linecap="round" opacity="0.6"/>
  <path d="M56,8 L56,14 M56,8 L50,8" fill="none" stroke="#00d4ff" stroke-width="1.5" stroke-linecap="round" opacity="0.6"/>
  <path d="M8,56 L8,50 M8,56 L14,56" fill="none" stroke="#7b2cbf" stroke-width="1.5" stroke-linecap="round" opacity="0.6"/>
  <path d="M56,56 L56,50 M56,56 L50,56" fill="none" stroke="#7b2cbf" stroke-width="1.5" stroke-linecap="round" opacity="0.6"/>
  
  <!-- Face oval -->
  <ellipse class="icon-face" cx="32" cy="28" rx="14" ry="17" fill="#0a0a15"/>
  <ellipse cx="32" cy="28" rx="14" ry="17" fill="none" stroke="url(#iconFace)" stroke-width="1.5" filter="url(#iconGlow)"/>
  
  <!-- Scan line -->
  <rect class="icon-scan" x="14" y="0" width="36" height="3" fill="#00d4ff" opacity="0.7" rx="1.5"/>
  
  <!-- Eyes -->
  <g class="icon-eye-l">
    <ellipse cx="26" cy="26" rx="3.5" ry="2.5" fill="#1a1a2e" stroke="#00d4ff" stroke-width="0.8"/>
    <circle cx="26" cy="26" r="1.2" fill="#00d4ff"/>
  </g>
  <g class="icon-eye-r">
    <ellipse cx="38" cy="26" rx="3.5" ry="2.5" fill="#1a1a2e" stroke="#00d4ff" stroke-width="0.8"/>
    <circle cx="38" cy="26" r="1.2" fill="#00d4ff"/>
  </g>
  
  <!-- Smile -->
  <path d="M27,36 Q32,40 37,36" fill="none" stroke="#00d4ff" stroke-width="1.2" stroke-linecap="round" opacity="0.7"/>
  
  <!-- Lock icon -->
  <rect x="27" y="48" width="10" height="8" rx="2" fill="#1a1a2e" stroke="#00d4ff" stroke-width="0.8"/>
  <path d="M29.5,48 L29.5,45.5 A2.5,2.5 0 0,1 34.5,45.5 L34.5,48" fill="none" stroke="#00d4ff" stroke-width="0.8"/>
  <circle cx="32" cy="52" r="1.2" fill="#00d4ff"/>
  
  <!-- Loading dots -->
  <g filter="url(#iconGlow)">
    <circle class="icon-dot-1" cx="20" cy="56" r="1.2" fill="#00d4ff"/>
    <circle class="icon-dot-2" cx="32" cy="56" r="1.2" fill="#7b2cbf"/>
    <circle class="icon-dot-3" cx="44" cy="56" r="1.2" fill="#00d4ff"/>
  </g>
</svg>